stages:
  - deploy

deploy_lambda:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]

  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com

  variables:
    ROLE_ARN: $AWS_ROLE_ARN
    AWS_DEFAULT_REGION: "eu-west-1"

  before_script:
    - dnf install -y zip || yum install -y zip
    - mkdir -p ~/.aws
    - >
      ASSUME_ROLE_OUTPUT=$(aws sts assume-role-with-web-identity
      --role-arn ${ROLE_ARN}
      --role-session-name "GitLabCI-${CI_PIPELINE_ID}"
      --web-identity-token ${AWS_OIDC_TOKEN}
      --duration-seconds 900
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "${ASSUME_ROLE_OUTPUT}" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "${ASSUME_ROLE_OUTPUT}" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "${ASSUME_ROLE_OUTPUT}" | awk '{print $3}')

  script:
    - echo "Compress Lambda..."
    - cd lambdas/ec2_restart/src && zip -r ../lambda_function.zip . && cd ../../..
    - echo "Push updates to AWS..."
    - aws lambda update-function-code --function-name restart_ec2_lambda --zip-file fileb://lambdas/ec2_restart/lambda_function.zip

  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
